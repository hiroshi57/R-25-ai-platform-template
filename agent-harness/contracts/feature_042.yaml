# feature_042 — 人間が読む契約（層1）
# コードが読むのは feature_042.json。両者は同じ内容を保つ。
feature_042:
  goal: 分析ダッシュボードに CSV エクスポートを追加する
  inputs:
    - issue.md
    - リポジトリ
    - design/export-flow.png
  constraints:
    - パブリック API を保持する
    - データベース スキーマを変更しない
    - 新しい依存関係を追加しない
  deliverable:
    type: file
    path: artifacts/export.csv
  done_when:
    - 出力スキーマが有効
    - エクスポートされた CSV がフィクスチャと一致する
    - 日付が ISO 8601 形式
    - 新しい依存関係を追加しない
  escalate_when:
    - スキーマの変更が必要と思われる
    - 同じ理由でチェックが 3 回失敗する
    - 要求された動作が既存の製品ルールと競合する
  max_repairs: 1
